<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Expense Tracker</title>
    <!-- Load Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 p-4 md:p-8 font-sans text-slate-800">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-slate-100">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Monthly Financial Overview</h1>
                <p class="text-slate-500 text-sm mt-1">Track your salary and expenses locally</p>
            </div>
            <div class="mt-4 md:mt-0 flex items-center space-x-3 bg-slate-50 p-2 rounded-lg border border-slate-200">
                <label class="text-sm font-semibold text-slate-600 px-2">Net Salary:</label>
                <div class="relative">
                    <span class="absolute left-3 top-2.5 text-slate-500">₹</span>
                    <input type="number" id="salaryInput" class="pl-7 pr-3 py-2 w-32 rounded-md border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none transition-all" value="50000">
                </div>
            </div>
        </div>

        <!-- Dashboard KPIs -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center space-x-4">
                <div class="p-3 bg-blue-100 text-blue-600 rounded-full">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                </div>
                <div>
                    <p class="text-sm font-medium text-slate-500">Total Budget</p>
                    <p class="text-2xl font-bold text-slate-900" id="totalBudgetDisplay">₹0</p>
                </div>
            </div>
            
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center space-x-4">
                <div class="p-3 bg-red-100 text-red-600 rounded-full">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"></path></svg>
                </div>
                <div>
                    <p class="text-sm font-medium text-slate-500" id="expensePercentageDisplay">Total Expenses (0%)</p>
                    <p class="text-2xl font-bold text-slate-900" id="totalExpensesDisplay">₹0</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center space-x-4">
                <div id="balanceIconContainer" class="p-3 rounded-full bg-emerald-100 text-emerald-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                    <p class="text-sm font-medium text-slate-500">Remaining Balance</p>
                    <p class="text-2xl font-bold text-emerald-600" id="remainingBalanceDisplay">₹0</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Input Form -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 lg:col-span-1 h-fit">
                <h2 class="text-lg font-bold text-slate-900 mb-4">Add New Expense</h2>
                <form id="expenseForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
                        <input type="text" id="descInput" required placeholder="e.g., Grocery" class="w-full p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Amount (₹)</label>
                        <div class="relative">
                            <span class="absolute left-3 top-2.5 text-slate-500">₹</span>
                            <input type="number" id="amountInput" required min="1" placeholder="0" class="w-full pl-7 pr-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
                        <select id="categoryInput" class="w-full p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            <option value="Housing">Housing & Rent</option>
                            <option value="Food">Food & Dining</option>
                            <option value="Transport">Transportation</option>
                            <option value="Utilities">Utilities & Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Add Expense
                    </button>
                </form>
            </div>

            <!-- Visualization & History -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Chart -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <h2 class="text-lg font-bold text-slate-900 mb-4">Expense Distribution</h2>
                    <div class="h-64 relative w-full flex justify-center">
                        <canvas id="expenseChart"></canvas>
                        <div id="noDataMessage" class="absolute inset-0 flex items-center justify-center text-slate-400 hidden">
                            No expenses added yet
                        </div>
                    </div>
                </div>

                <!-- List -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <h2 class="text-lg font-bold text-slate-900 mb-4">Recent Transactions</h2>
                    <div id="emptyListMessage" class="text-slate-500 text-sm hidden">Your transaction history is empty.</div>
                    <div id="expenseList" class="space-y-3 max-h-72 overflow-y-auto pr-2">
                        <!-- Items injected here by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let salary = 50000;
        let expenses = [];
        let chartInstance = null;

        // Chart Colors mapping
        const categoryColors = {
            'Housing': '#3b82f6',
            'Food': '#10b981',
            'Transport': '#f59e0b',
            'Utilities': '#ef4444',
            'Entertainment': '#8b5cf6',
            'Shopping': '#ec4899',
            'Other': '#64748b'
        };

        // Formatter for Indian Rupees
        const formatINR = (amount) => {
            return new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: 'INR',
                maximumFractionDigits: 0,
            }).format(amount || 0);
        };

        // Initialize App
        function init() {
            const savedData = localStorage.getItem('vanilla-salary-tracker');
            if (savedData) {
                const parsed = JSON.parse(savedData);
                salary = parsed.salary || 50000;
                expenses = parsed.expenses || [];
            }
            document.getElementById('salaryInput').value = salary;
            updateUI();
        }

        // Save to LocalStorage
        function saveData() {
            localStorage.setItem('vanilla-salary-tracker', JSON.stringify({ salary, expenses }));
        }

        // Generate Chart
        function renderChart(groupedData) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const labels = Object.keys(groupedData);
            const data = Object.values(groupedData);
            const bgColors = labels.map(label => categoryColors[label]);

            const noDataMsg = document.getElementById('noDataMessage');
            const canvas = document.getElementById('expenseChart');

            if (data.length === 0) {
                canvas.style.display = 'none';
                noDataMsg.classList.remove('hidden');
                return;
            } else {
                canvas.style.display = 'block';
                noDataMsg.classList.add('hidden');
            }

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: bgColors,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ' ' + formatINR(context.raw);
                                }
                            }
                        }
                    }
                }
            });
        }

        // Core UI Update function
        function updateUI() {
            const totalExpenses = expenses.reduce((sum, exp) => sum + exp.amount, 0);
            const balance = salary - totalExpenses;
            const percentage = salary > 0 ? ((totalExpenses / salary) * 100).toFixed(1) : 0;

            // Update KPIs
            document.getElementById('totalBudgetDisplay').textContent = formatINR(salary);
            document.getElementById('totalExpensesDisplay').textContent = formatINR(totalExpenses);
            document.getElementById('expensePercentageDisplay').textContent = `Total Expenses (${percentage}%)`;
            
            const balanceEl = document.getElementById('remainingBalanceDisplay');
            const balanceIcon = document.getElementById('balanceIconContainer');
            balanceEl.textContent = formatINR(balance);
            
            // Dynamic KPI Styling
            if (balance >= 0) {
                balanceEl.className = 'text-2xl font-bold text-emerald-600';
                balanceIcon.className = 'p-3 rounded-full bg-emerald-100 text-emerald-600';
            } else {
                balanceEl.className = 'text-2xl font-bold text-rose-600';
                balanceIcon.className = 'p-3 rounded-full bg-rose-100 text-rose-600';
            }

            // Update List
            const listEl = document.getElementById('expenseList');
            const emptyMsg = document.getElementById('emptyListMessage');
            listEl.innerHTML = '';
            
            if (expenses.length === 0) {
                emptyMsg.classList.remove('hidden');
            } else {
                emptyMsg.classList.add('hidden');
                expenses.forEach(exp => {
                    const item = document.createElement('div');
                    item.className = 'flex items-center justify-between p-3 hover:bg-slate-50 rounded-lg border border-slate-100 transition-colors';
                    const dateStr = new Date(exp.date).toLocaleDateString('en-IN');
                    
                    item.innerHTML = `
                        <div>
                            <p class="font-semibold text-slate-800">${exp.description}</p>
                            <p class="text-xs text-slate-500">${exp.category} • ${dateStr}</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="font-bold text-slate-700">${formatINR(exp.amount)}</span>
                            <button onclick="deleteExpense('${exp.id}')" class="text-rose-400 hover:text-rose-600 transition-colors p-1">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            }

            // Prepare Data for Chart
            const grouped = expenses.reduce((acc, curr) => {
                acc[curr.category] = (acc[curr.category] || 0) + curr.amount;
                return acc;
            }, {});
            renderChart(grouped);
            saveData();
        }

        // Event Listeners
        document.getElementById('salaryInput').addEventListener('input', (e) => {
            salary = Number(e.target.value) || 0;
            updateUI();
        });

        document.getElementById('expenseForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const desc = document.getElementById('descInput').value;
            const amount = document.getElementById('amountInput').value;
            const category = document.getElementById('categoryInput').value;

            if (!desc || !amount) return;

            expenses.unshift({
                id: Date.now().toString(),
                description: desc,
                amount: parseFloat(amount),
                category: category,
                date: new Date().toISOString()
            });

            document.getElementById('expenseForm').reset();
            document.getElementById('categoryInput').value = 'Housing'; // Reset select to default
            updateUI();
        });

        // Global delete function for inline HTML handler
        window.deleteExpense = function(id) {
            expenses = expenses.filter(exp => exp.id !== id);
            updateUI();
        };

        // Run setup
        init();
    </script>
</body>
</html>
